<style>

/* iOS faz zoom automático em campos com fonte < 16px: mantém 16px em ecrãs pequenos. */
@media(max-width:700px){input,select,textarea{font-size:16px}}

<script>

/* Compatibilidade: funções auxiliares e eventos de ponteiro para iOS/Safari anteriores (sem ??, Object.fromEntries, PointerEvent). */
/*@@CORE-BEGIN: gerado por tools/build_html.js a partir de shared/combat-core.js@@*/
/* Motor de combate partilhado (fonte única).

   Dependências do host: S (estado do jogador), speed, document (opcional), finish(B), pataPunches(). */
function nc(a,b){return a==null?b:a}
const DOGS={
corgi:{n:'Corgi Cavaleiro',c:'Guerreiro',r:0,hp:120,atk:14,def:5,spd:1,f:'#e9a24f',a:'#2c6bd9',e:0,w:'sword',d:'Armadura azul e dourada, olhar confiante.'},
bulldog:{n:'Bulldog Muralha',c:'Tanque',r:0,hp:190,atk:9,def:10,spd:.8,f:'#c9b49a',a:'#6b7a90',e:1,w:'shield',d:'Ninguém passa por este focinho.'},
collie:{n:'Collie Arqueiro',c:'Arqueiro',r:0,hp:90,atk:16,def:3,spd:1.2,f:'#2b2b33',a:'#2f9e6b',e:1,w:'bow',rg:1,d:'Pontaria de campeão.'},
shiba:{n:'Shiba Samurai',c:'Assassino',r:1,hp:95,atk:20,def:4,spd:1.5,f:'#f08a3c',a:'#c0392b',e:0,w:'sword',d:'Rápido como o vento.'},
husky:{n:'Husky Ártico',c:'Mago',r:1,hp:85,atk:22,def:3,spd:1,f:'#8fa4b8',a:'#7a4dd8',e:0,w:'staff',rg:1,d:'Uiva tempestades.'},
bernard:{n:'São Bernardo',c:'Suporte',r:1,hp:130,atk:10,def:6,spd:.9,f:'#b0703a',a:'#e8e8f0',e:1,w:'staff',rg:1,d:'Cura com um uivo.'},
golden:{n:'Golden Paladino',c:'Guerreiro',r:2,hp:150,atk:20,def:9,spd:1.1,f:'#f0c05a',a:'#ffd34a',e:1,w:'hammer',d:'Luz dourada na linha da frente.'},
doberman:{n:'Doberman Sombra',c:'Assassino',r:2,hp:115,atk:30,def:6,spd:1.7,f:'#1c1c24',a:'#7c3aed',e:0,w:'sword',d:'Uma lenda das sombras.'},
pinscher:{n:'Pinscher Ágil',c:'Assassino',r:1,hp:95,atk:16,def:5,spd:1.4,f:'#2d2220',a:'#b5562a',e:0,w:'sword',caixa:1,d:'Pequeno, rápido e sem medo de ninguém.'},
shihtzu:{n:'Shih Tzu Calmo',c:'Suporte',r:1,hp:115,atk:10,def:9,spd:1,f:'#e8d9c4',a:'#8b5a3c',e:0,w:'staff',caixa:1,d:'Um peluche que cura e acalma a equipa.'},
maltes:{n:'Maltês Real',c:'Tanque',r:2,hp:150,atk:10,def:11,spd:.85,f:'#f7f7f2',a:'#e9c46a',e:0,w:'shield',caixa:1,d:'Pelo branco como a neve e uma coroa de ouro.'}};
Object.defineProperty(DOGS,'petisco',{enumerable:false,value:{n:'Petisco Desertor',c:'Suporte',r:2,hp:120,atk:12,def:7,spd:1.1,f:'#e8c39a',a:'#7a2e8c',e:0,w:'staff',rg:1,traitor:1,d:'Trocou de equipa e de cor. A honra dele agora é outra.'}});
const SK={Guerreiro:{n:'Impacto de Aço',k:'strike',m:2.4},Assassino:{n:'Salto do Assassino',k:'strike',m:2.7},Mago:{n:'Chuva de Meteoros',k:'aoe',m:1.2},Tanque:{n:'Muralha de Patas',k:'shield'},Suporte:{n:'Uivo Curativo',k:'heal'},Arqueiro:{n:'Rajada',k:'multi',m:.85}};
const IT=[['w1','Espada de Madeira','w',4,30,0],['w2','Lâmina do Guardião','w',10,150,1],['w3','Martelo Trovejante','w',24,700,2],['w4','Espada Celestial','w',55,3500,3],['a1','Colete de Treino','a',4,30,0],['a2','Armadura de Bronze','a',10,150,1],['a3','Placas do Gladiador','a',24,700,2],['a4','Armadura Estelar','a',55,3500,3]].map(x=>({id:x[0],n:x[1],s:x[2],v:x[3],p:x[4],r:x[5]}));
const ITM=Object.fromEntries(IT.map(i=>[i.id,i]));
function stats(id){const d=DOGS[id],l=S.dogs[id].l,m=1+.12*(l-1);let hp=d.hp*m,atk=d.atk*m,def=d.def*m;const e=S.eq[id]||{};
 if(e.w)atk+=ITM[e.w].v;if(e.a){hp+=ITM[e.a].v*6;def+=ITM[e.a].v*.4}if(e.h){hp+=ITM[e.h].v*3;def+=ITM[e.h].v*.2}
 const x=treeFx(id);return{hp:Math.round(hp*(1+(x.hp||0))),atk:Math.round(atk*(1+(x.atk||0))),def:Math.round(def*(1+(x.def||0))),spd:d.spd,crit:Math.min(.75,.08+(d.c==='Assassino'?.12:0)+(x.crit||0))}}
function dogName(id){const d=S.dogs[id];return(d&&d.nm)||DOGS[id].n}
const TT=[['o',1,-1,{atk:.08}],['o',1,0,{atk:.06,crit:.04}],['o',2,1,{ultm:.2}],['d',1,-1,{hp:.1}],['d',1,3,{def:.12}],['d',2,4,{hp:.08,cdr:1}],['f',3,2,{ultm:.3,atk:.08,cdr:1.5}],['f',3,5,{hp:.15,def:.15,cdr:1.5}]];
function nodeFx(id,i){const c=DOGS[id].c,A=['Assassino','Mago','Arqueiro'].includes(c)?1.25:1,K=['Tanque','Suporte'].includes(c)?1.3:1,e=Object.assign({},TT[i][3]);for(const k in e){if(k==='atk'||k==='crit')e[k]*=A;if(k==='hp'||k==='def')e[k]*=K}return e}
function treeFx(id){const t={};for(const i of(S.tree&&S.tree[id])||[]){const e=nodeFx(id,i);for(const k in e)t[k]=(t[k]||0)+e[k]}t.ultm=Math.min(.8,t.ultm||0);t.cdr=Math.min(6,t.cdr||0);return t}
const food=id=>nc(S.dogs[id].fd,80),fat=id=>S.dogs[id].fa||0,hungerPen=id=>food(id)<30?(30-food(id))/30*.2:0,fatPen=id=>fat(id)>50?(fat(id)-50)/50*.10:0;
function cond(u){const d=S.dogs[u.id];if(!d)return u;const hp=hungerPen(u.id),tp=fatPen(u.id);if(hp>0)u.hp=Math.max(1,Math.round(u.hp*(1-hp)));if(tp>0)u.atk=Math.max(1,Math.round(u.atk*(1-tp)));if(d.bf){u.max=Math.round(u.max*1.1);u.hp=Math.round(u.hp*1.1)}return u}
const PH={w:.22,l:.12,r:.25},PHU={w:.5,l:.18,r:.4},CDMIN=6;
const ULT={corgi:{n:'Super Mordida',cd:12,m:3.4,t:'enemy'},shiba:{n:'Corte do Vento',cd:12,m:2.4,t:'enemy'},doberman:{n:'Mordida Fantasma',cd:20,m:4,t:'enemy'},golden:{n:'Martelo Solar',cd:20,m:2.8,t:'enemy'},husky:{n:'Eclipse Glacial',cd:20,m:1.5,t:'all'},collie:{n:'Tempestade de Flechas',cd:20,m:.9,t:'enemy'},bulldog:{n:'Muralha Indestrutível',cd:16,t:'allies'},bernard:{n:'Uivo da Aurora',cd:16,t:'allies'},petisco:{n:'Golpe Traidor',cd:14,m:2.6,t:'enemy'},pinscher:{n:'Investida Relâmpago',cd:14,m:1.1,t:'multi'},shihtzu:{n:'Brisa Purificadora',cd:16,m:2.5,t:'cleanse'},maltes:{n:'Pelo Dourado',cd:18,m:1,t:'guard'}};
const ENEMY_ULT=t=>t==='enemy'||t==='multi'||t==='guard';   // especiais que pedem um alvo inimigo
function mk(id,side,i,st,boss){const d=DOGS[id];return{id,side,i,n:side===0?dogName(id):d.n,cls:d.c,rg:!!d.rg,max:st.hp,hp:st.hp,atk:st.atk,def:st.def,spd:st.spd,crit:st.crit,en:0,sh:0,ph:null,pt:0,cd:.4+i*.25,tg:null,sk:false,fl:0,uc:0,um:1,ul:null,slow:0,tf:side===0?treeFx(id):{},boss:!!boss,e:side===1}}
/* Adversários por fase (ajuste de equilíbrio v29): [hp×, atk×, def×, taxa de usar habilidade].
   Fases 1–2 mantêm a fórmula original. Fases 3–4 ganham habilidades (antes nunca usavam) e mais vida/dano moderados.
   Fase 5 = boss São Bernardo: hp×3,3 (×4 de boss incluído no cálculo), ataque×3,2, usa a habilidade sempre que está pronto. */
const ENEMY_NB={1:[.8,.9,1,0],2:[.96,1.017,1.2,0],3:[1.9,1.4,1.44,.5],4:[1.8,1.4,1.728,.6]};
const ENEMY_BO=[2.3,2.6,2.074,1];
function enemyTune(stage,boss){if(boss){const f=Math.pow(1.2,Math.max(0,stage-5)),a=Math.pow(1.13,Math.max(0,stage-5));return{hm:ENEMY_BO[0]*f,am:ENEMY_BO[1]*a,dm:ENEMY_BO[2]*f,ai:ENEMY_BO[3]}}
 const b=ENEMY_NB[Math.min(stage,4)],f=stage>4?Math.pow(1.2,stage-4):1,a=stage>4?Math.pow(1.13,stage-4):1;return{hm:b[0]*f,am:b[1]*a,dm:b[2]*f,ai:b[3]}}
function startBattle(stage){const U=[];S.team.forEach((id,i)=>U.push(cond(mk(id,0,i,stats(id)))));
 const boss=stage%5===0,n=boss?1:Math.min(3,1+Math.floor(stage/3)),ids=Object.keys(DOGS).filter(k=>!DOGS[k].caixa);
 for(let i=0;i<n;i++){const id=ids[(stage+i*3)%ids.length],d=DOGS[id],k=boss?4:1,e=enemyTune(stage,boss);const u=mk(id,1,i,{hp:Math.round(d.hp*e.hm*k),atk:Math.round(d.atk*e.am),def:d.def*e.dm,spd:d.spd*(boss?.9:.95),crit:.05},boss);if(e.ai>0)u.ai=e.ai;U.push(u)}
 return{units:U,pend:[],ev:[],t:0,over:false,win:null,done:false,rew:null,stage,boss,dmg:0}}
const foes=(B,u)=>B.units.filter(x=>x.side!==u.side&&x.hp>0),allies=(B,u)=>B.units.filter(x=>x.side===u.side&&x.hp>0);
/* Aleatoriedade do combate. Por omissão usa Math.random (comportamento idêntico ao original).
   O servidor multiplayer injeta um gerador com semente via CRNG_SET para resultados reprodutíveis. */
var CRNG=null;function crng(){return CRNG?CRNG():Math.random()}
function hurt(B,a,t,m){if(t.hp<=0)return;const cr=crng()<a.crit;let d=Math.max(1,Math.round(a.atk*m*(cr?2:1)*100/(100+t.def*6)*(.9+crng()*.2)*(B.env==='marte'&&a.rg?.85:1)));
 if(t.sh>0){const ab=Math.min(t.sh,d);t.sh-=ab;d-=ab}t.hp=Math.max(0,t.hp-d);t.fl=.15;a.en=Math.min(100,a.en+25);t.en=Math.min(100,t.en+15);if(a.side===0)B.dmg+=d;
 B.ev.push({t:'hit',a,to:t,dmg:d,cr,rg:a.rg});if(t.hp<=0)B.ev.push({t:'die',u:t})}
/* ---- IA tática: camada de decisão usada por act() e useUlt(); não cria motor paralelo ---- */
const TAC_PROF={Guerreiro:{atk:1,kill:.6,threat:.3,focus:.4,prot:0,mark:.2,n:'agressivo'},Tanque:{atk:.4,kill:.2,threat:.8,focus:.2,prot:1,mark:.1,n:'protetor'},Assassino:{atk:.8,kill:1.2,threat:.4,focus:.3,prot:0,mark:1,n:'assassino'},Mago:{atk:.6,kill:.7,threat:.6,focus:.5,prot:.2,mark:.4,n:'controlador'},Arqueiro:{atk:.6,kill:.7,threat:.6,focus:.5,prot:.2,mark:.4,n:'estratega'},Suporte:{atk:.3,kill:.2,threat:.5,focus:.2,prot:.9,mark:.1,n:'protetor'}};

/* ===== MULTIPLAYER (módulo independente) =====
   Interface da aba Multiplayer. Não calcula resultados competitivos: mostra o estado enviado pelo servidor.
   Dependências do jogo (só leitura/desenho): S, DOGS, ITM, TT, ULT, dogName, portrait, toast, render, P, cv, tab, escH. */
const MP_VERSION = '28';
/* ===== CONFIGURAÇÃO DO SERVIDOR MULTIPLAYER (só o administrador edita esta linha) =====
   Endereço público do backend alojado, sempre com wss:// e terminado em /ws.
   Exemplo: 'wss://doggo-league.onrender.com/ws'
   Enquanto estiver vazio, o multiplayer mostra "servidor não configurado" aos jogadores.
   Quando o jogo é aberto em localhost/127.0.0.1 (testes do desenvolvedor), usa ws://localhost:8080/ws. */
const MP_SERVER_URL = '';
const MP_LOCAL_DEV_URL = 'ws://localhost:8080/ws';
const MPS = {
  url: '', ws: null, status: 'offline', retry: 0, timer: null, seq: 1, pending: new Map(),
  token: null, user: null, view: 'auth', built: null, err: '', notice: '',
  rooms: [], online: 0, room: null, battle: null, end: null, rank: null, rankAt: 0, targetK: null,
  busy: false,
};
const MP_MSG = {
  invalid_credentials: 'Nome ou palavra-passe incorretos', rate_limited: 'Demasiadas tentativas. Tenta mais tarde.',
  username_taken: 'Esse nome já existe', invalid_username: 'Nome: 3 a 20 caracteres (letras, números ou _)',
  weak_password: 'A palavra-passe deve ter entre 8 e 128 caracteres', server_full: 'Servidor cheio. Tenta daqui a pouco.',
  session_invalid: 'A sessão expirou. Entra novamente.', room_full: 'A sala está cheia', wrong_password: 'Password incorreta',
  version_mismatch: 'Versão do jogo incompatível com o servidor', too_many_messages: 'Demasiados pedidos. Espera um pouco.',
};

// ---------- ligação ----------
function mpAddr() {
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname)) return MP_LOCAL_DEV_URL;
  if (MP_SERVER_URL) return MP_SERVER_URL;
  // Por omissão o servidor está no mesmo endereço que a página (o Worker serve o jogo e /ws). HTTPS -> wss://
  if (location.protocol === 'https:' || location.protocol === 'http:') return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  return '';
}
function mpToken(v) { try { if (v === undefined) return sessionStorage.getItem('doggo_mp_token'); if (v) sessionStorage.setItem('doggo_mp_token', v); else sessionStorage.removeItem('doggo_mp_token') } catch (e) { } return v }

function mpConnect() {
  clearTimeout(MPS.timer);
  if (MPS.ws && MPS.ws.readyState <= 1) return;
  MPS.url = mpAddr();
  if (!MPS.url) { MPS.status = 'error'; MPS.err = 'Multiplayer indisponível: o servidor ainda não está configurado nesta versão do jogo.'; mpPaint(); return }
  MPS.status = 'connecting'; mpPaint();
  let ws;
  try { ws = new WebSocket(MPS.url) } catch (e) { MPS.status = 'error'; MPS.err = 'Endereço do servidor inválido'; mpPaint(); return }
  MPS.ws = ws;
  const url = MPS.url; let opened = false;
  /* Tempo limite: sem resposta em 6 s, mostra o endereço e a causa provável em vez de ficar em "A ligar…". */
  const guard = setTimeout(() => { if (ws.readyState === 0) { MPS.err = 'Sem resposta de ' + url + ' em 6 s. Confirma que o servidor está a correr nesse endereço (ver DEPLOY.md).'; try { ws.close() } catch (e) { } mpPaint() } }, 6000);
  ws.onopen = () => {
    opened = true; clearTimeout(guard); MPS.err = '';
    MPS.status = 'online'; MPS.retry = 0; mpPaint();
    mpReq({ type: 'hello', version: MP_VERSION }).then(() => {
      const t = mpToken();
      if (!t) { MPS.view = 'auth'; mpPaint(); return }
      return mpReq({ type: 'resume', token: t }).then(r => mpLoggedIn(r)).catch(e => { mpToken(null); MPS.user = null; MPS.err = e.message; MPS.view = 'auth'; mpPaint() });
    }).catch(e => { MPS.err = e.message; mpPaint() });
  };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data) } catch (e) { return } mpOnMessage(m) };
  ws.onclose = () => {
    clearTimeout(guard);
    if (!opened && !MPS.err) MPS.err = 'Não foi possível ligar a ' + url + '. Verifica se o servidor está a correr (npm start) e se o endereço está certo.';
    MPS.ws = null; MPS.status = 'offline';
    for (const p of MPS.pending.values()) p.rej(new Error('Sem ligação ao servidor'));
    MPS.pending.clear();
    MPS.retry = Math.min(MPS.retry + 1, 5);
    MPS.timer = setTimeout(mpConnect, 1000 * (2 ** (MPS.retry - 1)));
    mpPaint();
  };
  ws.onerror = () => { };
}
function mpDisconnect() { clearTimeout(MPS.timer); MPS.retry = 0; if (MPS.ws) { MPS.ws.onclose = null; MPS.ws.close() } MPS.ws = null; MPS.status = 'offline' }

function mpReq(obj, timeout = 8000) {
  return new Promise((res, rej) => {
    if (!MPS.ws || MPS.ws.readyState !== 1) return rej(new Error('Sem ligação ao servidor'));
    const id = MPS.seq++;
    const t = setTimeout(() => { MPS.pending.delete(id); rej(new Error('O servidor não respondeu')) }, timeout);
    MPS.pending.set(id, {
      res: m => { clearTimeout(t); res(m) },
      rej: e => { clearTimeout(t); rej(e) },
    });
    MPS.ws.send(JSON.stringify(Object.assign({}, obj, { id })));
  });
}

function mpOnMessage(m) {
  if (m.id !== undefined && MPS.pending.has(m.id)) {
    const p = MPS.pending.get(m.id); MPS.pending.delete(m.id);
    if (m.type === 'error') p.rej(new Error(MP_MSG[m.code] || m.message || 'Erro')); else p.res(m);
    return;
  }
  switch (m.type) {
    case 'rooms_changed': if (MPS.view === 'hub') mpLoadRooms(); break;
    case 'room_state': MPS.room = m.room; mpPaint(); break;
    case 'battle_start': case 'battle_resume': mpBattleStart(m); break;
    case 'battle_tick': mpBattleTick(m); break;
    case 'battle_end': mpBattleEnd(m); break;
    case 'opponent_disconnected': MPS.notice = 'O adversário perdeu a ligação. Combate em pausa durante ' + Math.round(m.graceMs / 1000) + ' s.'; mpBattleNotice(); break;
    case 'opponent_reconnected': MPS.notice = 'O adversário voltou. O combate continua.'; mpBattleNotice(); break;
    case 'room_closed': MPS.notice = 'A sala foi fechada por inatividade.'; MPS.room = null; MPS.view = 'hub'; mpPaint(); break;
    case 'replaced': MPS.notice = 'Iniciaste sessão noutro separador. Esta sessão foi terminada.'; MPS.user = null; mpToken(null); MPS.view = 'auth'; mpPaint(); break;
  }
}

// ---------- sessão ----------
function mpLoggedIn(r) {
  MPS.user = { userId: r.userId, username: r.username };
  if (r.token) mpToken(r.token);
  MPS.err = ''; MPS.view = MPS.battle ? 'battle' : 'hub'; mpPaint();
  mpLoadRooms();
  mpReq({ type: 'my_room' }).then(m => { if (m.room) { MPS.room = m.room; MPS.view = m.room.state === 'in_combat' ? 'battle' : 'lobby'; mpPaint() } }).catch(() => { });
}
// ---- palavras-passe: derivadas NO COMPUTADOR (PBKDF2-SHA256, 100 000 iterações). O servidor só recebe a chave derivada (pdk).
const MP_PW_ITER = 100000;
const MP_ROOM_SALT = 'doggo-room-v1';
function mpHexBytes(h) { return Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16))) }
async function mpDerive(password, saltBytes) {
  if (!window.crypto || !crypto.subtle) throw new Error('Este navegador não suporta a cifra necessária. Abre o jogo em HTTPS ou em localhost.');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations: MP_PW_ITER, hash: 'SHA-256' }, key, 256);
  return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
}
async function mpAuth(kind, username, password) {

    if (kind === 'register' && (typeof password !== 'string' || password.length < 8 || password.length > 128)) throw new Error(MP_MSG.weak_password);
    // 1) sal da conta (o mesmo para contas inexistentes: não revela quem existe)

// Plantel do jogo convertido para o formato do servidor, limitado ao nível competitivo (19).
// Só serve para pedir; o servidor valida tudo e recusa o que não for legal.
function mpRosterFromGame() {
  const dogs = S.team.slice(0, 3).map(id => {
    const d = S.dogs[id] || { l: 1 };
    const lvl = Math.min(19, Math.max(1, Math.floor(d.l || 1)));
    const eq = {};
    const e = S.eq[id] || {};
    for (const k of ['w', 'a', 'h']) if (e[k] && ITM[e[k]] && ITM[e[k]].s === k) eq[k] = e[k];
    const budget = lvl - 1, keep = []; let spent = 0, forks = 0;
    for (const i of ((S.tree && S.tree[id]) || [])) {
      const n = TT[i]; if (!n) continue;
      if (n[2] >= 0 && !keep.includes(n[2])) continue;
      if (n[0] === 'f') { if (forks) continue; forks++ }
      if (spent + n[1] > budget) continue;
      spent += n[1]; keep.push(i);
    }
    const nick = d.nm ? String(d.nm).replace(/[^A-Za-z0-9 ._-]/g, '').trim().slice(0, 16) : '';
    const dog = { id, level: lvl, eq, tree: keep };
    if (nick) dog.nickname = nick;
    return dog;
  });
  return { dogs };
}

// ---------- combate (estado vindo do servidor) ----------
const NET_JITTER=0.8;   // segundos de buffer: a imagem fica ligeiramente atrasada, mas sem saltos
/* ===== Combate online: o MESMO renderer do single-player (drawBattle, battleScene, drawFX, onEv) ===== */
/* O servidor é a autoridade: envia, por passo, o estado visual e os eventos (frames). O cliente só os reproduz,
   na mesma ordem e com o mesmo tempo de jogo; não calcula dano, HP nem habilidades. */
var NET={on:false,over:false,pb:null,side:0,battleId:null,roomId:null,q:[],qi:0,playT:0,end:null,hold:0,note:'',dmg:[0,0],lastT:-1,log:[],stats:{frames:0,hits:0,ults:0,deaths:0,tipos:{},applied:[]}};
function netUnit(su,local){
  return {k:su.k,side:su.side===local?0:1,id:su.id,n:su.n,cls:su.cls,lvl:su.lvl,hp:su.hp,max:su.max,sh:su.sh||0,en:su.en||0,uc:su.uc||0,
    ph:su.ph||null,pt:su.pt||0,stun:su.stun||0,rg:!!su.rg,boss:!!su.boss,e:su.side!==local,hat:su.hat===undefined?null:su.hat,um:su.um||1,
    ul:su.ulName?{n:su.ulName,id:su.id}:null,tg:null};
}
function netLinkTargets(pb,units){
  for(const su of units){const u=pb.units[su.k]; if(u) u.tg=(su.tg==null||su.tg<0)?null:(pb.units[su.tg]||null)}
}
function netEv(e,pb){
  const o={};
  for(const k in e){const v=e[k];
    if((k==='a'||k==='to'||k==='u')&&typeof v==='number'){const r=pb.units[v]; if(!r) return null; o[k]=r}
    else o[k]=v}
  return o;
}
function netApply(f,showEv){
  const pb=NET.pb; if(!pb) return; NET.stats.frames++;
  NET.stats.applied.push([+f.t.toFixed(2), Date.now()]);
  for(const su of f.units){const u=pb.units[su.k]; if(!u) continue;
    u.hp=su.hp; u.max=su.max; u.sh=su.sh||0; u.en=su.en||0; u.uc=su.uc||0; u.um=su.um||1; u.ph=su.ph||null; u.pt=su.pt||0; u.stun=su.stun||0;
    u.rg=!!su.rg; u.hat=su.hat===undefined?null:su.hat; u.ul=su.ulName?{n:su.ulName,id:su.id}:null}
  netLinkTargets(pb,f.units);
  if(!showEv) return;
  for(const e of f.ev){
    if(e.t==='end') continue;                       // o fim é mostrado quando a reprodução chega ao fim
    const o=netEv(e,pb); if(!o) continue;
    if(e.t==='hit'||e.t==='bhit'){const d=+e.dmg||0; if(o.to){ if(o.to.side===1) NET.dmg[0]+=d; else NET.dmg[1]+=d }}
    if(e.t==='ult')NET.stats.ults++; if(e.t==='hit')NET.stats.hits++; if(e.t==='die')NET.stats.deaths++;
    NET.stats.tipos[e.t]=(NET.stats.tipos[e.t]||0)+1;
    pb.ev.push(o);
  }
}
function netStart(m){
  const pb={units:[],pend:[],ev:[],t:(m.snapshot&&m.snapshot.t)||0,over:false,win:null,rew:null,intro:0,netView:true,stage:0,lvl:null,camp:null};
  pb.units=m.snapshot.units.map(su=>netUnit(su,m.side));
  netLinkTargets(pb,m.snapshot.units);
  Object.assign(NET,{on:true,over:false,pb,side:m.side,battleId:m.battleId,roomId:m.roomId,q:[],qi:0,lastMs:null,playT:pb.t-NET_JITTER,end:null,hold:0,note:'',dmg:[0,0],lastT:pb.t,log:[],stats:{frames:0,hits:0,ults:0,deaths:0,tipos:{},applied:[]}});
  MPS.battle=NET; MPS.end=null; MPS.notice=''; MPS.view='battle';
  const cvEl=document.getElementById('cv'); if(cvEl) cvEl.style.display='';   // mpEnter esconde o canvas; o combate precisa dele
  B=pb; selU=null; tab='fight'; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==='fight')); render();
}
function netTick(dt){
  const pb=NET.pb; if(!pb) return;
  // relógio de reprodução = tempo real medido (não o dt do quadro, que pode ser limitado): os dois jogadores avançam igual
  const agora=performance.now(); const real=NET.lastMs==null?0:Math.min(.5,(agora-NET.lastMs)/1000); NET.lastMs=agora;
  if(NET.over){NET.hold-=dt; if(NET.hold<=0) netLeave(); return}
  const last=NET.q.length?NET.q[NET.q.length-1].t:NET.playT;
  NET.playT+=real;
  let salto=false;
  if(last-NET.playT>1.5){NET.playT=last-.5; salto=true}   // atraso grande (>1,5 s): salta os efeitos antigos, mantém o estado
  while(NET.qi<NET.q.length&&NET.q[NET.qi].t<=NET.playT+1e-6){const f=NET.q[NET.qi++]; netApply(f,!(salto&&f.t<NET.playT-.5))}
  pb.t=NET.playT;
  if(NET.end&&NET.qi>=NET.q.length&&NET.playT>=NET.end.t-1e-6) netEndPlayed();
}
function netEndPlayed(){
  const pb=NET.pb; if(!pb||NET.over) return;
  NET.over=true; pb.over=true;
  pb.win=!!(MPS.end&&MPS.user&&MPS.end.winnerUserId===MPS.user.userId);
  NET.hold=2.5;                                  // mantém o último estado visível antes do ecrã final
  netPanel();
}

}

/* Normaliza o endereço do servidor escrito pelo jogador: aceita ws(s)://, http(s)://, só o domínio ou host:porta, e acrescenta /ws.
   Endereços locais usam ws://; remotos usam wss://. Numa página HTTPS, ws:// remoto é promovido a wss:// (o navegador bloquearia o outro). */
function mpNormAddr(v) {
  v = String(v || '').trim(); if (!v) return '';
  let proto = null, rest = v; const m = v.match(/^([a-z]+):\/\/(.*)$/i);
  if (m) { proto = m[1].toLowerCase(); rest = m[2] }
  rest = rest.replace(/\/+$/, ''); const i = rest.indexOf('/');
  const host = i < 0 ? rest : rest.slice(0, i), path = i < 0 ? '/ws' : rest.slice(i);
  if (!host) return '';
  const local = /^(localhost|127\.0\.0\.1|\[::1\])(:|$)/i.test(host);
  let p = (proto === 'http' || proto === 'ws') ? 'ws' : (proto === 'https' || proto === 'wss') ? 'wss' : (local ? 'ws' : 'wss');
  if (p === 'ws' && !local && location.protocol === 'https:') p = 'wss';
  return p + '://' + host + path;
}

function hatHook(B){const q=S.q;if(B.win&&!B.dev){if(B.train)q.trainW++;const en=B.units.filter(u=>u.side===1);const has=f=>en.some(u=>{const d=DOGS[u.id]||NPC[u.id];return!!(d&&d[f])});if(has('mk'))q.monkW++;if(has('gor'))q.gorW++;if(has('ninja'))q.ninjaW++;if(has('tree'))q.boxW++}hatCheck()}

 c.save();c.translate(b.x+b.w/2,b.y);c.rotate(sw);c.scale(1+(1-k)*.5,k);c.fillStyle='#8b2e1e';c.strokeStyle='#150b2c';c.lineWidth=3;c.beginPath();c.roundRect(-b.w/2,0,b.w,b.h,28);c.fill();c.stroke();c.fillStyle='#ffffff22';c.fillRect(-b.w/2+18,18,b.w-36,8);c.restore();

 c.font='bold 26px system-ui';c.fillStyle=left<15000?'#ff5d4a':'#ffd34a';const tt='⏱ '+mm+':'+ss;c.strokeText(tt,W/2,72);c.fillText(tt,W/2,72);

/* ---- Sessão de teste: cópia de segurança antes de qualquer alteração ---- */
function devBackup(){
 if(DEV.sess)return true;
 if(devGetBak()){devMsg('Existe uma sessão de teste por resolver (a página foi recarregada). Restaura ou conserva essa sessão antes de começar outra.',true);return false}
 try{
  const raw=JSON.stringify(S);
  localStorage.setItem(DEV_BAK,raw);
  if(localStorage.getItem(DEV_BAK)!==raw)throw new Error('verificação falhou');
  DEV.sess=1;return true;
 }catch(e){
  DEV.sess=0;devMsg('Não foi possível criar a cópia de segurança. As alterações ficam bloqueadas para proteger o save.',true);return false;
 }
}

/* Confirmação em dois toques dentro do painel (não usa confirm(), que pode ser bloqueado ou cancelado sem aviso) */
function devArm(k){if(DEV.arm!==k){DEV.arm=k;return false}DEV.arm=null;return true}
function devRestore(){
 const raw=devGetBak();
 if(!raw){devMsg('Não existe cópia de segurança ativa.',true);return}
 if(B&&!B.over){devMsg('Termina o combate atual antes de restaurar.',true);return}
 if(!devArm('restore')){devMsg('Toca outra vez em Restaurar para confirmar. As alterações de teste serão perdidas.',true);return}
 let o=null;try{o=JSON.parse(raw)}catch(e){}
 if(!o||typeof o!=='object'){devMsg('A cópia é inválida: nada foi alterado.',true);return}
 S=sanitize(o);B=null;DEV.sess=0;
 if(!save()){devMsg('Erro ao gravar a restauração: a cópia foi mantida.',true);return}
 try{localStorage.removeItem(DEV_BAK)}catch(e){}
 render();devMsg('Estado original restaurado. Progresso anterior ao teste repõe-se.');
}
function devKeep(){
 if(!devGetBak()){devMsg('Não existe sessão de teste por resolver.',true);return}
 if(!devArm('keep')){devMsg('Toca outra vez em Conservar para confirmar. Mantém moedas, itens e cães de teste; o progresso de campanha volta ao valor anterior.',true);return}
 let o=null;try{o=JSON.parse(devGetBak())}catch(e){}
 if(o&&typeof o==='object'){const base=sanitize(o);S.ot=base.ot;S.pt=base.pt}
 DEV.sess=0;try{localStorage.removeItem(DEV_BAK)}catch(e){}
 save();devMsg('Alterações conservadas (sem progresso de campanha). Sessão encerrada.');
}

// fn devolve null (ok) ou texto de erro (nada aplicado). get(): valor mostrado antes/depois.
function devDo(fn,label,get){
 if(!devBackup())return;
 const wasB=B,wasCut=cut;
 let before='';try{before=get?get():''}catch(e){}
 let e;
 try{e=fn()}catch(err){devMsg('Erro interno: '+err.message+'. Verifica o estado antes de continuar.',true);return}
 if(e){devMsg('Não aplicado: '+e,true);return}
 render();
 if(!save()){devMsg('Erro: o save não foi gravado (armazenamento cheio ou bloqueado). Usa "Restaurar original".',true);return}
 let after='';try{after=get?get():''}catch(er){}
 if((B&&B!==wasB&&!B.over)||(cut&&cut!==wasCut))DEV.min=true;
 devMsg('OK · '+label+(get?' · antes: '+before+' → depois: '+after:''));
}

const DEV_DRAG={on:null};
// Arrastar por rato ou toque. Os botões dentro da barra continuam a funcionar.
function devBindDrag(el,p,isChip){
 el.style.touchAction='none';
 el.onpointerdown=e=>{
  if(e.target.closest('button,input,select,label,textarea'))return;
  const r=p.getBoundingClientRect();
  DEV_DRAG.on={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,moved:false};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 };
 el.onpointermove=e=>{
  const d=DEV_DRAG.on;if(!d||d.id!==e.pointerId)return;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6)return;
  d.moved=true;e.preventDefault();
  const x=Math.max(0,Math.min(innerWidth-p.offsetWidth,e.clientX-d.dx));
  const y=Math.max(0,Math.min(innerHeight-40,e.clientY-d.dy));
  if(isChip)DEV.cpos={x,y};else DEV.pos={x,y};
  p.style.left=x+'px';p.style.top=y+'px';
 };
 const end=e=>{
  const d=DEV_DRAG.on;if(!d||d.id!==e.pointerId)return;
  DEV_DRAG.on=null;
  if(isChip&&!d.moved&&e.type==='pointerup')devMin(false);
 };
 el.onpointerup=end;el.onpointercancel=end;
}

 if(cut.step>=2&&cut.step<3)planetDraw(cut.reg,W-120-q*120,120,Math.max(10,70-q*70),t);if(cut.step>=3)planetDraw(cut.reg,W-150,140,70,t);

function nextCampTarget(r){

 if(n>4)return{done:1,lbl:'Região '+R.n+' concluída'};
 if(n>S.cp.p[r.reg])return{locked:'Vence o combate atual para desbloquear o seguinte.'};
 if(r.reg==='sol'&&S.gems<5)return{locked:'Precisas de 5 gemas para o próximo combate (tens '+S.gems+').'};
 return{go:r.reg,idx:n,name:R.en[n]}}

 return`<div class='row' style='border:2px solid var(--gold)'><div><b>Próximo nível</b><small>${t.name}</small></div><button onclick='campNext()'>Continuar para o próximo nível</button></div>`}

/* ===== Exportar / importar save (para passar o progresso entre versões ou navegadores). Sem prompt/confirm (compatível com iOS). ===== */
function saveBox(title,hint,val,editable){
 let bx=document.getElementById('savebox');
 if(!bx){bx=document.createElement('div');bx.id='savebox';bx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:12px';document.body.appendChild(bx)}
 bx.innerHTML=`<div style="background:#1b1f3a;color:#fff;border-radius:12px;padding:14px;max-width:420px;width:100%;display:grid;gap:8px"><b>${title}</b><small>${hint}</small><textarea id="sb-txt" rows="8" style="width:100%;font:12px monospace;background:#0b0e20;color:#fff;box-sizing:border-box" ${editable?'':'readonly'}></textarea><div style="display:flex;gap:6px;flex-wrap:wrap">${editable?'<button id="sb-ok" type="button">Importar</button>':'<button id="sb-dl" type="button">Descarregar ficheiro</button><button id="sb-cp" type="button">Copiar</button>'}<button id="sb-x" type="button">Fechar</button></div></div>`;
 const t=bx.querySelector('#sb-txt');t.value=val||'';
 bx.querySelector('#sb-x').onclick=()=>bx.remove();
 if(!editable){
  bx.querySelector('#sb-dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.value],{type:'application/json'}));a.download='doggo_save.json';document.body.appendChild(a);a.click();a.remove()};
  bx.querySelector('#sb-cp').onclick=()=>{t.focus();t.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('Seleciona o texto e copia')}};
 }else bx.querySelector('#sb-ok').onclick=()=>saveImport(t.value,bx);
}
function saveExport(){save();const raw=localStorage.getItem('doggo1')||JSON.stringify(S);saveBox('Exportar save','Descarrega o ficheiro ou copia o texto. Em qualquer versão, usa «Importar save» e cola este texto.',raw,false)}
function saveImport(txt,bx){
 let o;try{o=JSON.parse(String(txt).trim())}catch(e){toast('Texto inválido: não é um save');return}
 if(!o||typeof o!=='object'||(typeof o.coins!=='number'&&!o.dogs)){toast('Isto não parece um save do Doggo League');return}
 try{const cur=localStorage.getItem('doggo1');if(cur)localStorage.setItem('doggo1_antes_importar',cur);localStorage.setItem('doggo1',JSON.stringify(o))}catch(e){toast('Não foi possível gravar o save');return}
 DEV.sess=1; /* bloqueia gravações automáticas com o estado antigo até recarregar */
 if(bx)bx.remove();toast('Save importado. A recarregar…');setTimeout(()=>location.reload(),600);
}
